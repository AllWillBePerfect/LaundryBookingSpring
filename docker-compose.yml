services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundry_booking_db
      POSTGRES_USER: laundry_booking_user
      POSTGRES_PASSWORD: laundry_booking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: